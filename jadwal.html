</html><!DOCTYPE html>
<html<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Jadwal Operasional</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #171717;

            /* Background geometris */
            background-color: #e9ecef;
            background-image:
                conic-gradient(
                    from 45deg at 25% 25%,
                    #f7f9fa 0deg 90deg,
                    #dce0e3 90deg 180deg,
                    #eef0f2 180deg 270deg,
                    #e2e6e9 270deg
                );
            background-size: 220px 220px;
        }

        header {
            text-align: center;
            padding: 35px 15px 20px;
        }

        .logo {
            font-size: 100px;
            line-height: 1.2;
            color: #087dbd;
        }

        .logo span {
            color: #e52d36;
        }

        nav {
            margin-top: 20px;
            font-size: 23px;
        }

        nav a {
            color: #512477;
            text-decoration: underline;
            margin: 0 3px;
        }

        hr {
            margin: 20px 5%;
            border: none;
            border-top: 1px solid #999;
        }

        main {
            padding: 15px 5% 35px;
        }

        h1 {
            font-size: 36px;
            font-weight: normal;
            margin: 25px 0 40px;
        }

        table {
            width: 270px;
            max-width: 100%;
            border-collapse: collapse;
            background: #f5f5f5;
            font-size: 23px;
        }

        th, td {
            border: 1px solid #222;
            padding: 15px 13px;
            text-align: left;
            line-height: 1.8;
            font-weight: normal;
        }

        th {
            background: #f0f0f0;
        }

        .catatan {
            font-style: italic;
            line-height: 1.8;
        }

        footer {
            text-align: center;
            color: #777;
            font-size: 18px;
            padding: 20px 10px 40px;
        }

        @media (max-width: 400px) {
            h1 {
                font-size: 30px;
            }

            table {
                font-size: 20px;
            }

            nav {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">
            ☕
        </div>

        <nav>
            <a href="index.html">Beranda</a> |
            <a href="#jadwal">Jadwal Operasional</a>
        </nav>
    </header>

    <hr>

    <main id="jadwal">
        <h1>Jam Operasional Kedai</h1>

        <table>
            <tr>
                <th>Hari</th>
                <th>Jam Buka</th>
            </tr>

            <tr>
                <td>Senin - Jumat</td>
                <td>09.00 - 22.00</td>
            </tr>

            <tr>
                <td>Sabtu - Minggu</td>
                <td>10.00 - 24.00</td>
            </tr>

            <tr>
                <td colspan="2" class="catatan">
                    Format waktu dalam WIB
                </td>
            </tr>
        </table>
    </main>

    <footer>
        Aziz Yusuf Permana @2026
    </footer>

</body>
</html>
